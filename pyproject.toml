[project]
name = "timeknot"
version = "0.1.0"
description = "Personal Russian-language Telegram task and reminder assistant"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.3",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "openai>=2.53.0",
    "sqlalchemy[asyncio]>=2.0",
]

[project.scripts]
timeknot = "bot.__main__:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
